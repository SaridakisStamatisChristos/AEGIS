version: '3.8'

# =============================================================================
# DEFAULT COMPOSE FILE — development only.
# DO NOT use this file for staging or production without overriding all
# credentials via a .env file or environment variables.
# For production, use ops/k8s/ manifests.
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-aegisrun}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aegisrun}
      POSTGRES_DB: ${DB_NAME:-aegisrun}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aegisrun}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-aegisrun}
      DB_PASSWORD: ${DB_PASSWORD:-aegisrun}
      DB_NAME: ${DB_NAME:-aegisrun}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      OIDC_ISSUER: ${OIDC_ISSUER:-mock}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      MAX_TOKEN_AGE_SECONDS: ${MAX_TOKEN_AGE_SECONDS:-3600}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
