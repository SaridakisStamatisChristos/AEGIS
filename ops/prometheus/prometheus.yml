# AegisRun Prometheus Configuration
# Scrapes metrics from AegisRun API and supporting services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aegisrun
    environment: development

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files for recording rules and alerts
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics
    scheme: http

  # AegisRun API Server
  - job_name: aegisrun-api
    static_configs:
      - targets:
          - api:9090
        labels:
          service: api
          component: backend
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: (.+):(\d+)
        replacement: $1

  # AegisRun API (alternate name for docker-compose.dev)
  - job_name: aegisrun-api-dev
    static_configs:
      - targets:
          - aegisrun-api-dev:9090
        labels:
          service: api
          component: backend
          environment: dev
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s

  # PostgreSQL Exporter (if deployed)
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
          component: database
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s

  # Node Exporter (system metrics)
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node
          component: infrastructure
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s

  # Docker containers (via cAdvisor)
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: cadvisor
          component: infrastructure
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "http://remote-storage:9201/write"
#     queue_config:
#       max_samples_per_send: 1000
#       max_shards: 200
#       capacity: 2500

# Storage configuration
storage:
  tsdb:
    retention:
      time: 15d
    wal_compression: true
