apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisrun-ingress
  namespace: aegisrun
  labels:
    app.kubernetes.io/name: aegisrun
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - aegisrun.example.com
      secretName: aegisrun-tls
  rules:
    - host: aegisrun.example.com
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aegisrun-api
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: aegisrun-api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: aegisrun-api
                port:
                  number: 80
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: aegisrun-api
                port:
                  number: 80
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: aegisrun-api
                port:
                  number: 80
          # UI routes (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegisrun-ui
                port:
                  number: 80
