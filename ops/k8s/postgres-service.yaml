apiVersion: v1
kind: Service
metadata:
  name: aegisrun-postgres
  namespace: aegisrun
  labels:
    app.kubernetes.io/name: aegisrun
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: aegisrun
    app.kubernetes.io/component: postgres
