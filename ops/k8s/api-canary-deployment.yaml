apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisrun-api-canary
  namespace: aegisrun
  labels:
    app.kubernetes.io/name: aegisrun
    app.kubernetes.io/component: api
    app.kubernetes.io/variant: canary
  annotations:
    description: "Canary deployment for validating new releases before full rollout"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisrun
      app.kubernetes.io/component: api
      app.kubernetes.io/variant: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisrun
        app.kubernetes.io/component: api
        app.kubernetes.io/variant: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aegisrun-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          # Image tag is overridden by kustomize or the canary-deploy.sh script
          image: ghcr.io/aegisrun/aegisrun/api:canary
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aegisrun-config
            - secretRef:
                name: aegisrun-secrets
          env:
            - name: CANARY
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: [api]
                topologyKey: kubernetes.io/hostname
