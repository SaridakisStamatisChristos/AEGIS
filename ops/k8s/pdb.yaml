apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegisrun-api-pdb
  namespace: aegisrun
  labels:
    app.kubernetes.io/name: aegisrun
    app.kubernetes.io/component: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisrun
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegisrun-ui-pdb
  namespace: aegisrun
  labels:
    app.kubernetes.io/name: aegisrun
    app.kubernetes.io/component: ui
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisrun
      app.kubernetes.io/component: ui
