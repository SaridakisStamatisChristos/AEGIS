name: Prepare v1.0.1 npm metadata

on:
  push:
    branches:
      - release/v1.0.1-prep
    paths:
      - '.github/workflows/release-prep-npm.yml'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare npm package metadata
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24.21.0'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            sdk/typescript/package-lock.json

      - name: Set UI release version
        working-directory: ./ui
        run: |
          npm version 1.0.1 --no-git-tag-version --allow-same-version --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Set TypeScript SDK release version
        working-directory: ./sdk/typescript
        run: |
          npm version 1.0.1 --no-git-tag-version --allow-same-version --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit npm-generated metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/package.json ui/package-lock.json sdk/typescript/package.json sdk/typescript/package-lock.json
          if git diff --cached --quiet; then
            echo "npm metadata already canonical for v1.0.1."
            exit 0
          fi
          git commit -m "Release: set npm package versions to 1.0.1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
