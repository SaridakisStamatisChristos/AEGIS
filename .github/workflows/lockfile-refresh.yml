name: Refresh npm lockfiles

on:
  push:
    branches:
      - fix/npm-security-2026-09
    paths:
      - '.github/workflows/lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh npm lockfiles
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24.21.0'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            sdk/typescript/package-lock.json

      - name: Resolve UI lockfile with npm
        working-directory: ./ui
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --omit=dev --ignore-scripts || true
          npm audit --omit=dev --audit-level=high

      - name: Resolve TypeScript SDK lockfile with npm
        working-directory: ./sdk/typescript
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit npm-generated lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/package-lock.json sdk/typescript/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already canonical."
            exit 0
          fi
          git commit -m "Security: refresh npm lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
