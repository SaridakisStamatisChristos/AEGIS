name: Refresh npm lockfiles

on:
  push:
    branches:
      - 'fix/release-pipeline-hardening-2026-09'

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh production lockfiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            sdk/typescript/package-lock.json

      - name: Refresh UI production dependency lock
        working-directory: ./ui
        run: |
          npm audit fix --package-lock-only --omit=dev || true
          npm audit --omit=dev --audit-level=high

      - name: Refresh TypeScript SDK production dependency lock
        working-directory: ./sdk/typescript
        run: |
          npm audit fix --package-lock-only --omit=dev || true
          npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfiles
        shell: bash
        run: |
          if git diff --quiet -- ui/package-lock.json sdk/typescript/package-lock.json; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/package-lock.json sdk/typescript/package-lock.json
          git commit -m "Security: refresh patched npm production locks"
          git push origin HEAD:fix/release-pipeline-hardening-2026-09

      - name: Upload regenerated lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: refreshed-npm-lockfiles
          path: |
            ui/package-lock.json
            sdk/typescript/package-lock.json
          if-no-files-found: error
          retention-days: 1
