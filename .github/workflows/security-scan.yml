name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  GO_VERSION: '1.24.13'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================================================
  # Go Security Scanning
  # ==========================================================================
  go-security:
    name: Go Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-api.sarif ./api/...'

      - name: Run Gosec on Verifier
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-verifier.sarif ./verifier/...'

      - name: Upload API SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-api.sarif
          category: gosec-api

      - name: Upload Verifier SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-verifier.sarif
          category: gosec-verifier

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd api && govulncheck ./...
          cd ../verifier && govulncheck ./...

  # ==========================================================================
  # Dependency Vulnerability Scanning
  # ==========================================================================
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Go API)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './api'
          format: 'sarif'
          output: 'trivy-api.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (Verifier)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './verifier'
          format: 'sarif'
          output: 'trivy-verifier.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (UI)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './ui'
          format: 'sarif'
          output: 'trivy-ui.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (Python SDK)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './sdk/python'
          format: 'sarif'
          output: 'trivy-python-sdk.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (TypeScript SDK)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './sdk/typescript'
          format: 'sarif'
          output: 'trivy-ts-sdk.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload API Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload Verifier Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-verifier.sarif
          category: trivy-verifier

      - name: Upload UI Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-ui.sarif
          category: trivy-ui

  # ==========================================================================
  # Container Image Scanning
  # ==========================================================================
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          load: true
          tags: aegisrun-api:scan

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          load: true
          tags: aegisrun-ui:scan

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aegisrun-api:scan'
          format: 'sarif'
          output: 'trivy-container-api.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Scan UI image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aegisrun-ui:scan'
          format: 'sarif'
          output: 'trivy-container-ui.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload API container scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container-api.sarif
          category: container-api

      - name: Upload UI container scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container-ui.sarif
          category: container-ui

  # ==========================================================================
  # CodeQL Analysis
  # ==========================================================================
  codeql-go:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-go

  codeql-javascript:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-javascript

  codeql-python:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-python

  # ==========================================================================
  # Secret Scanning
  # ==========================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # License Compliance
  # ==========================================================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Go licenses
        run: |
          go install github.com/google/go-licenses@latest
          cd api && go-licenses check ./... --disallowed_types=forbidden,restricted || true
          cd ../verifier && go-licenses check ./... --disallowed_types=forbidden,restricted || true

      - name: Check npm licenses
        run: |
          npm install -g license-checker
          cd ui && npm ci && license-checker --production --failOn 'GPL;AGPL;LGPL'
          cd ../sdk/typescript && npm ci && license-checker --production --failOn 'GPL;AGPL;LGPL'

      - name: Check Python licenses
        run: |
          pip install pip-licenses
          cd sdk/python && pip install -e . && pip-licenses --fail-on 'GPL;AGPL;LGPL'

  # ==========================================================================
  # SBOM Generation
  # ==========================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # ==========================================================================
  # Security Report Summary
  # ==========================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [go-security, dependency-scan, container-scan, codeql-go, codeql-javascript, codeql-python, secret-scan, license-check]
    if: always()
    
    steps:
      - name: Check security scan results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go Security | ${{ needs.go-security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL (Go) | ${{ needs.codeql-go.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL (JS/TS) | ${{ needs.codeql-javascript.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL (Python) | ${{ needs.codeql-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
