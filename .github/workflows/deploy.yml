name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GO_VERSION: '1.27.1'

jobs:
  deployment-preflight:
    name: Deployment Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate deployment target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
              echo "::error::Production deployment must be dispatched from a v* release tag."
              exit 1
            fi

            RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
            if [ "$(printf '%s' "$RELEASE_JSON" | jq -r '.isDraft')" != "false" ]; then
              echo "::error::Production deployment requires a published GitHub Release."
              exit 1
            fi
            if [ "$(printf '%s' "$RELEASE_JSON" | jq -r '.isPrerelease')" != "false" ]; then
              echo "::error::Prerelease tags cannot be deployed to production."
              exit 1
            fi
          fi

  # ==========================================================================
  # Build and Push Docker Images
  # ==========================================================================
  build-api:
    name: Prepare API Image
    runs-on: ubuntu-latest
    needs: [deployment-preflight]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.digest.outputs.digest }}
      image-name: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract staging metadata
        if: inputs.environment == 'staging'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-

      - name: Build and push staging image
        if: inputs.environment == 'staging'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Resolve published release image
        if: inputs.environment == 'production'
        id: published
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_REF="${{ steps.image.outputs.name }}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" | awk '/^Digest:/ {print $2; exit}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve immutable digest for $IMAGE_REF."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Select immutable image digest
        id: digest
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            DIGEST="${{ steps.published.outputs.digest }}"
          else
            DIGEST="${{ steps.build.outputs.digest }}"
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Image preparation did not produce a valid sha256 digest."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


  build-ui:
    name: Prepare UI Image
    runs-on: ubuntu-latest
    needs: [deployment-preflight]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.digest.outputs.digest }}
      image-name: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/ui" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract staging metadata
        if: inputs.environment == 'staging'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-

      - name: Build and push staging image
        if: inputs.environment == 'staging'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_URL=/api

      - name: Resolve published release image
        if: inputs.environment == 'production'
        id: published
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_REF="${{ steps.image.outputs.name }}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" | awk '/^Digest:/ {print $2; exit}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve immutable digest for $IMAGE_REF."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Select immutable image digest
        id: digest
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            DIGEST="${{ steps.published.outputs.digest }}"
          else
            DIGEST="${{ steps.build.outputs.digest }}"
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Image preparation did not produce a valid sha256 digest."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


  # ==========================================================================
  # Deploy to Staging
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-ui]
    if: inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.aegisrun.io
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Update image tags
        run: |
          cd ops/k8s
          kustomize edit set image ghcr.io/aegisrun/aegisrun/api=${{ needs.build-api.outputs.image-name }}@${{ needs.build-api.outputs.image-digest }}
          kustomize edit set image ghcr.io/aegisrun/aegisrun/ui=${{ needs.build-ui.outputs.image-name }}@${{ needs.build-ui.outputs.image-digest }}

      - name: Deploy to staging
        run: |
          kubectl apply -k ops/k8s
          kubectl -n aegisrun rollout status deployment/aegisrun-api --timeout=300s
          kubectl -n aegisrun rollout status deployment/aegisrun-ui --timeout=300s

      - name: Run smoke tests
        run: |
          STAGING_URL="https://staging.aegisrun.io"
          echo "Checking /health..."
          curl -sf "$STAGING_URL/health" || { echo "FAIL: /health not reachable"; exit 1; }
          echo "Checking /ready..."
          curl -sf "$STAGING_URL/ready" || { echo "FAIL: /ready not reachable"; exit 1; }
          echo "Smoke tests passed"

      - name: Notify deployment
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Staging deployment ${{ job.status }}: ${{ github.repository }}@${{ github.sha }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Staging Deployment ${{ job.status }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"

  # ==========================================================================
  # Deploy to Production
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api, build-ui]
    if: inputs.environment == 'production'
    environment:
      name: production
      url: https://aegisrun.io
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Run database migrations from the candidate image
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: aegisrun-migrate-${{ github.run_id }}-${{ github.run_attempt }}
            namespace: aegisrun
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: aegisrun
                  app.kubernetes.io/component: api
                  aegisrun.io/workload: migration
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  fsGroup: 1000
                containers:
                  - name: migrate
                    image: ${{ needs.build-api.outputs.image-name }}@${{ needs.build-api.outputs.image-digest }}
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" \
                        /app/migrate \
                          -path /app/migrations \
                          -database "postgres://$DB_HOST:$DB_PORT/$DB_NAME?sslmode=$DB_SSL_MODE" \
                          up
                    envFrom:
                      - configMapRef:
                          name: aegisrun-config
                      - secretRef:
                          name: aegisrun-secrets
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
          EOF

          if ! kubectl -n aegisrun wait --for=condition=complete "job/aegisrun-migrate-${{ github.run_id }}-${{ github.run_attempt }}" --timeout=300s; then
            kubectl -n aegisrun logs "job/aegisrun-migrate-${{ github.run_id }}-${{ github.run_attempt }}" || true
            exit 1
          fi
          kubectl -n aegisrun logs "job/aegisrun-migrate-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Update image tags
        run: |
          cd ops/k8s
          kustomize edit set image ghcr.io/aegisrun/aegisrun/api=${{ needs.build-api.outputs.image-name }}@${{ needs.build-api.outputs.image-digest }}
          kustomize edit set image ghcr.io/aegisrun/aegisrun/ui=${{ needs.build-ui.outputs.image-name }}@${{ needs.build-ui.outputs.image-digest }}

      - name: Deploy to production
        run: |
          kubectl apply -k ops/k8s
          kubectl -n aegisrun rollout status deployment/aegisrun-api --timeout=300s
          kubectl -n aegisrun rollout status deployment/aegisrun-ui --timeout=300s

      - name: Run production smoke tests
        run: |
          PROD_URL="https://aegisrun.io"
          echo "Checking /health..."
          curl -sf "$PROD_URL/health" || { echo "FAIL: /health not reachable"; exit 1; }
          echo "Checking /ready..."
          curl -sf "$PROD_URL/ready" || { echo "FAIL: /ready not reachable"; exit 1; }
          echo "Production smoke tests passed"

      - name: Notify deployment
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Production deployment ${{ job.status }}: ${{ github.repository }}@${{ github.sha }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Production Deployment ${{ job.status }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
