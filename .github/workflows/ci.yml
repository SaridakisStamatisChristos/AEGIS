name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.24.13'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================================================
  # Go API Tests
  # ==========================================================================
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aegisrun
          POSTGRES_PASSWORD: aegisrun
          POSTGRES_DB: aegisrun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Install dependencies
        working-directory: ./api
        run: go mod download

      - name: Run migrations
        working-directory: ./api
        env:
          DATABASE_URL: postgres://aegisrun:aegisrun@localhost:5432/aegisrun_test?sslmode=disable
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Run tests
        working-directory: ./api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: aegisrun
          DB_PASSWORD: aegisrun
          DB_NAME: aegisrun_test
          DB_SSL_MODE: disable
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./api/coverage.out
          flags: api

  # ==========================================================================
  # Go Linting
  # ==========================================================================
  api-lint:
    name: API Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: ./api
          version: latest

  # ==========================================================================
  # Verifier Tests
  # ==========================================================================
  verifier-test:
    name: Verifier Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: verifier/go.sum

      - name: Run tests
        working-directory: ./verifier
        run: go test -v -race ./...

  # ==========================================================================
  # Python SDK Tests
  # ==========================================================================
  python-sdk-test:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install dependencies
        working-directory: ./sdk/python
        run: |
          pip install -e ".[dev]"

      - name: Run linting
        working-directory: ./sdk/python
        run: |
          ruff check .
          black --check .
          mypy aegisrun

      - name: Run tests
        working-directory: ./sdk/python
        run: pytest -v --cov=aegisrun

  # ==========================================================================
  # TypeScript SDK Tests
  # ==========================================================================
  typescript-sdk-test:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: ./sdk/typescript
        run: npm ci

      - name: Run linting
        working-directory: ./sdk/typescript
        run: npm run lint

      - name: Run tests
        working-directory: ./sdk/typescript
        run: npm test

      - name: Build
        working-directory: ./sdk/typescript
        run: npm run build

  # ==========================================================================
  # UI Build & Tests
  # ==========================================================================
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Run linting
        working-directory: ./ui
        run: npm run lint

      - name: Run tests
        working-directory: ./ui
        run: npm run test -- --run

      - name: Type check
        working-directory: ./ui
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  # ==========================================================================
  # Unified Quality Gate
  # ==========================================================================
  unified-verify:
    name: Unified Verify Gate
    runs-on: ubuntu-latest
    needs: [api-test, verifier-test, python-sdk-test, typescript-sdk-test, ui-build]

    steps:
      - name: Verify upstream module gates passed
        run: |
          echo "API, Verifier, Python SDK, TypeScript SDK, and UI gates all passed."

  # ==========================================================================
  # Docker Build
  # ==========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api-lint, unified-verify]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: aegisrun/api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: false
          tags: aegisrun/ui:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Migration Check
  # ==========================================================================
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aegisrun
          POSTGRES_PASSWORD: aegisrun
          POSTGRES_DB: aegisrun_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations up
        env:
          DATABASE_URL: postgres://aegisrun:aegisrun@localhost:5432/aegisrun_migration_test?sslmode=disable
        run: migrate -path api/migrations -database "$DATABASE_URL" up

      - name: Run migrations down
        env:
          DATABASE_URL: postgres://aegisrun:aegisrun@localhost:5432/aegisrun_migration_test?sslmode=disable
        run: migrate -path api/migrations -database "$DATABASE_URL" down -all

      - name: Run migrations up again (idempotency check)
        env:
          DATABASE_URL: postgres://aegisrun:aegisrun@localhost:5432/aegisrun_migration_test?sslmode=disable
        run: migrate -path api/migrations -database "$DATABASE_URL" up
